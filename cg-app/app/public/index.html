<script>
  // crypto.randomUUID exists only on a secure origin, and a phone that opens
  // a dev server by its LAN address over http is not one.
  if (window.crypto && !crypto.randomUUID) {
    crypto.randomUUID = function () {
      var b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join("");
      return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
    };
  }
</script>

<style>
  html, body { width:100%; height:100%; margin:0; overflow:hidden;
               background:var(--cg-surface); color:var(--cg-ink);
               font-family:system-ui,sans-serif; }
  body { display:flex; flex-direction:column; }
  .cg-shell-connecting { display:inline-flex; align-items:center; gap:6px;
                         font-size:12px; padding:2px 8px; border-radius:10px;
                         background:var(--cg-run-bg); color:var(--cg-run);
                         white-space:nowrap; }
  .cg-shell-connecting-dot { width:7px; height:7px; border-radius:50%;

  @keyframes cg-pulse { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
  /* Panels stay mounted, because the canvas, Monaco and maplibre must never
     unmount. CSS hides them. */
  #app { flex:1; min-height:0; display:flex; flex-direction:column; }
  .cg-main { flex:1; min-height:0; display:flex; position:relative; }
  .cg-panel { flex:1 1 0; min-width:0; position:relative; overflow:hidden;
              display:flex; flex-direction:column; }
  /* Not data-hidden: the Carbon css hides [data-hidden]:not([data-fixed])
     for any value. */
  .cg-panel[data-panel-hidden="true"] { display:none; }
  #root { flex:1; min-height:0; }
  .cg-sidebar { flex:none; width:250px; max-width:80vw; overflow-y:auto;
                background:var(--cg-surface-raised);
                border-right:1px solid var(--cg-line-soft); padding:10px; }
  .cg-sidebar[data-overlay="true"] { position:absolute; top:0; left:0; bottom:0;
                z-index:9000; box-shadow:0 2px 6px rgba(0,0,0,0.3); }
  .cg-sidebar-backdrop { position:absolute; inset:0; z-index:8999;
                background:rgba(0,0,0,0.4); }
  .cg-map-panel { flex:1; min-height:0; position:relative; }
  #cg-map { position:absolute; inset:0; }
  .cg-map-placeholder { position:absolute; inset:0; display:flex; align-items:center;
                        justify-content:center; background:var(--cg-surface-sunk);
                        color:var(--cg-ink-muted); }
  .cg-map-crs-button { position:absolute; top:8px; left:8px; z-index:2;
                       background:rgba(0,0,0,0.7); color:#fff; font-size:12px;
                       border:1px solid rgba(255,255,255,0.3); border-radius:4px;
                       padding:4px 10px; cursor:pointer; }
  .cg-map-proj-status { position:absolute; top:8px; right:8px; z-index:2;
                        background:rgba(0,0,0,0.7); color:#fff; font-size:12px;
                        border-radius:4px; padding:4px 10px; }
  .cg-map-proj-status[data-status="error"] { background:var(--cg-error-bg); color:var(--cg-error);
                        border:1px solid var(--cg-error); padding-right:28px;
                        max-width:min(26rem, calc(100% - 150px)); }
  .cg-map-proj-reason { margin-top:2px; font-size:11px; opacity:0.85; overflow-wrap:anywhere; }
  .cg-map-proj-dismiss { position:absolute; top:2px; right:4px; background:none; border:0;
                         color:inherit; font-size:16px; line-height:1; cursor:pointer; }
  .cg-crs-row { padding:8px 16px; cursor:pointer;
                border-bottom:1px solid var(--cg-line-soft); }
  .cg-crs-row:hover { background:var(--cg-surface-sunk); }
  .cg-crs-row[data-selected="true"] { background:var(--cg-run-bg); }
  .cg-code-panel { flex:1; min-height:0; display:flex; flex-direction:column; }
  .cg-code-tabs { flex:none; display:flex; gap:8px; padding:6px 10px;
                  border-bottom:1px solid var(--cg-line-soft); }
  .cg-code-editor { flex:1; min-height:0; }
  .react-flow__node { font-size:12px; }
  .cg-shell-chip { font-size:12px; }
  .cg-settings { position:absolute; top:36px; right:8px; z-index:20;
                 background:var(--cg-surface-raised); border:1px solid var(--cg-line-soft);
                 border-radius:6px; padding:10px; display:flex; flex-direction:column;
                 gap:8px; font-size:12px; }
  .cg-settings-row { display:flex; gap:8px; align-items:center; }
  .cg-settings-radio { display:flex; gap:3px; align-items:center; }
